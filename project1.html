<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Fatima</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fff1f5 0%, #ffe3ee 35%, #ffdce9 100%);
      font-family: Arial, sans-serif;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(3px);
    }

    #login {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.8);
      width: 360px;
      padding: 35px 28px 25px;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(188, 114, 145, 0.16);
      text-align: center;
      backdrop-filter: blur(10px);
    }

    #login h2 {
      margin: 0 0 22px;
      color: #5a1830;
      font-size: 2rem;
      letter-spacing: 1px;
      animation: glowText 2s ease-in-out infinite alternate;
    }

    #login input {
      width: 100%;
      padding: 14px 14px;
      margin: 10px 0;
      border: 1px solid #f2bfd0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: rgba(255, 255, 255, 0.8);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    #login input:focus {
      border-color: #e0245e;
      box-shadow: 0 0 0 4px rgba(224, 36, 94, 0.12);
      transform: scale(1.01);
    }

    #login button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #f43f78, #d9145c);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      box-shadow: 0 10px 20px rgba(224, 36, 94, 0.25);
      animation: pulseButton 1.8s ease-in-out infinite;
    }

    #login button:hover {
      transform: translateY(-1px) scale(1.01);
      box-shadow: 0 12px 22px rgba(224, 36, 94, 0.3);
      filter: brightness(1.03);
    }

    #error {
      color: #d61d4c;
      margin-top: 14px;
      min-height: 20px;
      font-size: 14px;
      font-weight: 600;
      animation: fadeInText 0.5s ease;
    }

    #main {
      display: none;
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #fff3f8 0%, #ffdfe8 30%, #ffc9d9 100%);
      color: #5a1830;
      text-align: center;
      overflow: hidden;
    }

    #main h1 {
      font-size: 52px;
      margin-top: 18vh;
      text-shadow: 0 0 18px rgba(255, 109, 150, 0.7);
      position: relative;
      z-index: 2;
      animation: fadeInText 1s ease, glowText 1.8s ease-in-out infinite alternate;
    }

    #message {
      margin-top: 25px;
      font-size: 28px;
      min-height: 40px;
      text-shadow: 0 0 12px rgba(255, 109, 150, 0.7);
      position: relative;
      z-index: 2;
      animation: fadeInText 0.8s ease, bounceText 1.5s ease-in-out infinite alternate;
    }

    #buttons {
      position: relative;
      z-index: 2;
      margin-top: 25px;
    }

    .center-btn,
    .corner-btn {
      cursor: pointer;
      border: none;
      color: white;
      background: linear-gradient(135deg, #ff7aa8, #f54c82);
      border-radius: 25px;
      transition: 0.2s ease, transform 0.2s ease;
      box-shadow: 0 8px 16px rgba(245, 76, 130, 0.18);
      animation: floatButton 2.2s ease-in-out infinite alternate;
    }

    .center-btn {
      padding: 12px 24px;
      font-size: 18px;
      margin: 10px;
    }

    .center-btn:hover,
    .corner-btn:hover {
      transform: scale(1.05);
      filter: brightness(1.04);
    }

    .corner-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 18px;
      font-size: 16px;
      z-index: 3;
    }

    .petal {
      position: absolute;
      top: -60px;
      font-size: 24px;
      pointer-events: none;
      animation: fall linear forwards;
      z-index: 1;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }

    @keyframes glowText {
      from {
        text-shadow: 0 0 8px rgba(255, 109, 150, 0.5);
      }
      to {
        text-shadow: 0 0 18px rgba(255, 109, 150, 0.9);
      }
    }

    @keyframes fadeInText {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounceText {
      from {
        transform: translateY(0px);
      }
      to {
        transform: translateY(-4px);
      }
    }

    @keyframes pulseButton {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.02);
      }
    }

    @keyframes floatButton {
      from {
        transform: translateY(0px);
      }
      to {
        transform: translateY(-3px);
      }
    }

    .pdf-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 4;
      padding: 12px 20px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff7aa8, #f54c82);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(245, 76, 130, 0.2);
      animation: floatButton 2.2s ease-in-out infinite alternate;
    }

    .hidden {
      display: none !important;
    }

    @media print {
      body {
        background: #fff !important;
        overflow: visible !important;
      }

      body::before,
      .petal,
      .corner-btn,
      .center-btn,
      .pdf-btn {
        display: none !important;
      }

      #login {
        display: none !important;
      }

      #main {
        display: block !important;
        position: static !important;
        background: #fff9fb !important;
        color: #5a1830 !important;
        text-align: center !important;
        min-height: 100vh;
      }

      #main h1,
      #message {
        color: #5a1830 !important;
        text-shadow: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div id="login">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Login" />
    <input type="password" id="password" placeholder="Password" />
    <button type="button" onclick="checkLogin()">Enter</button>
    <div id="error"></div>
  </div>

  <!-- MAIN PAGE -->
  <div id="main">
    <button class="corner-btn" id="thanksBtn" type="button" onclick="showStep1()">Thanks</button>
    <button class="pdf-btn" type="button" onclick="window.print()">Save as PDF</button>

    <h1 id="congrats">Congratulations!</h1>
    <div id="message"></div>

    <div id="buttons">
      <button class="center-btn hidden" id="whatBtn" type="button" onclick="showStep2()">What?</button>
      <button class="center-btn hidden" id="noBtn" type="button" onclick="showStep3()">No, it's not true</button>
      <button class="center-btn hidden" id="loveBtn" type="button" onclick="showFinal()">Next</button>
    </div>
  </div>

  <script>
    function checkLogin() {
      const user = document.getElementById("username").value.trim().toLowerCase();
      const pass = document.getElementById("password").value.trim();

      if (user === "fatima" && pass === "29112006") {
        document.getElementById("login").style.display = "none";
        document.getElementById("main").style.display = "block";
        startPetals();
        document.getElementById("congrats").classList.remove("hidden");
      } else {
        document.getElementById("error").textContent = "Wrong login or password";
      }
    }

    function startPetals() {
      setInterval(() => {
        const petal = document.createElement("div");
        petal.className = "petal";
        petal.textContent = "🌹";
        petal.style.left = Math.random() * 100 + "vw";
        const dur = 4 + Math.random() * 4;
        petal.style.animationDuration = dur + "s";
        document.getElementById("main").appendChild(petal);

        setTimeout(() => petal.remove(), dur * 1000);
      }, 300);
    }

    function showStep1() {
      document.getElementById("thanksBtn").classList.add("hidden");
      document.getElementById("message").textContent = "You are officially mine 💖";
      document.getElementById("whatBtn").classList.remove("hidden");
      document.getElementById("noBtn").classList.remove("hidden");
    }

    function showStep2() {
      document.getElementById("whatBtn").classList.add("hidden");
      document.getElementById("noBtn").classList.add("hidden");
      document.getElementById("message").textContent = "For further information, press next 💖";
      document.getElementById("loveBtn").classList.remove("hidden");
    }

    function showStep3() {
      document.getElementById("whatBtn").classList.add("hidden");
      document.getElementById("noBtn").classList.add("hidden");
      document.getElementById("message").textContent = "Yes, you heard right!";
      document.getElementById("loveBtn").classList.remove("hidden");
    }

    function showFinal() {
      document.getElementById("loveBtn").classList.add("hidden");
      document.getElementById("message").textContent = "Oh, it's true... I love you Fatima ❤️";
    }
  </script>
</body>
</html>
