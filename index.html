<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fun Quiz Time</title>
<style>
  :root {
    --bg: #fff7ed;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --primary: #7c3aed;
    --good: #16a34a;
    --bad: #dc2626;
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1027;
      --card: #2a1d3d;
      --text: #f3f4f6;
      --muted: #c4b5fd;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1027;
    --card: #2a1d3d;
    --text: #f3f4f6;
    --muted: #c4b5fd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  #app {
    width: 100%;
    max-width: 520px;
    padding: 24px 16px;
  }
  h1 { font-size: 1.8rem; text-align: center; margin: 8px 0 20px; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    text-align: center;
  }
  .big-emoji { font-size: 3.5rem; margin: 6px 0; }
  .quiz-grid { display: grid; gap: 12px; margin-top: 8px; }
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    padding: 14px 16px;
    background: var(--primary);
    color: #fff;
    width: 100%;
    font-weight: 600;
    transition: transform 0.1s ease, opacity 0.2s;
  }
  button:active { transform: scale(0.98); }
  button.option {
    background: var(--card);
    color: var(--text);
    border: 2px solid var(--primary);
    text-align: left;
  }
  button.category {
    background: var(--primary);
    color: #fff;
    font-size: 1.05rem;
  }
  button.secondary {
    background: transparent;
    color: var(--primary);
    border: 2px solid var(--primary);
  }
  .progress { color: var(--muted); font-size: 0.9rem; margin-bottom: 8px; }
  .question { font-size: 1.25rem; font-weight: 600; margin: 10px 0 18px; line-height: 1.4; }
  .options { display: grid; gap: 10px; }
  .title { font-size: 1.8rem; font-weight: 800; margin: 6px 0; }
  .message { color: var(--muted); margin: 8px 0 20px; line-height: 1.5; }
  .congrats .title { color: var(--good); }
  .tryagain .title { color: var(--bad); }
  .actions { display: grid; gap: 10px; margin-top: 16px; }
  .score { font-size: 2.4rem; font-weight: 800; color: var(--primary); }
  .fade-in { animation: fade 0.35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="app"></div>

<script>
const QUIZZES = {
  funny: {
    name: "Funny Quiz",
    emoji: "😂",
    questions: [
      { q: "What do you call a fake noodle?", options: ["An impasta", "A spaghetto", "A noodle fraud", "Ramen-don"], answer: 0 },
      { q: "Why did the scarecrow win an award?", options: ["He was outstanding in his field", "He had a great hat", "He never blinked", "He grew the tallest corn"], answer: 0 },
      { q: "What do you get when you cross a snowman and a vampire?", options: ["Frostbite", "Blood ice", "A chilly bite", "Snow fangs"], answer: 0 }
    ]
  },
  silly: {
    name: "Extra funny Quiz",
    emoji: "🤪",
    questions: [
      { q: "What color is a sneeze?", options: ["Blue", "Green", "Sneeze has no color", "Purple on Tuesdays"], answer: 2 },
      { q: "How many pancakes can fit in an empty stomach?", options: ["Exactly 7", "As many as you can eat", "Zero, because pancakes are flat", "A dozen"], answer: 1 },
      { q: "Which animal is the best at rollerskating?", options: ["The penguin", "The snail", "The cat in socks", "The moose"], answer: 0 }
    ]
  },
  animals: {
    name: "Animal Quiz",
    emoji: "🐼",
    questions: [
      { q: "What is the fastest land animal?", options: ["Lion", "Cheetah", "Horse", "Greyhound"], answer: 1 },
      { q: "How many hearts does an octopus have?", options: ["One", "Two", "Three", "Eight"], answer: 2 },
      { q: "What do you call a baby kangaroo?", options: ["Kitten", "Cub", "Joey", "Pup"], answer: 2 }
    ]
  }
};

const app = document.getElementById("app");
let state = { category: null, index: 0, score: 0, wrongAnswer: null };

function showMenu() {
  state = { category: null, index: 0, score: 0, wrongAnswer: null };
  const buttons = Object.keys(QUIZZES).map(key =>
    `<button class="category" onclick="startQuiz('${key}')">${QUIZZES[key].emoji} ${QUIZZES[key].name}</button>`
  ).join("");
  app.innerHTML = `
    <div class="fade-in">
      <h1>🎉 Fun Quiz Time 🎉</h1>
      <div class="card">
        <p class="message">Pick a quiz and see how well you know your stuff!</p>
        <div class="quiz-grid">${buttons}</div>
      </div>
    </div>`;
}

function startQuiz(key) {
  state.category = key;
  state.index = 0;
  state.score = 0;
  showQuestion();
}

function showQuestion() {
  const quiz = QUIZZES[state.category];
  const q = quiz.questions[state.index];
  const total = quiz.questions.length;
  const options = q.options.map((opt, i) =>
    `<button class="option" onclick="choose(${i})">${String.fromCharCode(65 + i)}. ${opt}</button>`
  ).join("");
  app.innerHTML = `
    <div class="fade-in card">
      <div class="progress">${quiz.emoji} ${quiz.name} · Question ${state.index + 1} of ${total}</div>
      <div class="question">${q.q}</div>
      <div class="options">${options}</div>
      <div class="actions"><button class="secondary" onclick="showMenu()">Back to menu</button></div>
    </div>`;
}

function choose(i) {
  const q = QUIZZES[state.category].questions[state.index];
  if (i === q.answer) {
    state.score++;
    show congrats you are gay 🌈();
  } else {
    state.wrongAnswer = i;
    show Gay people make mistakes 😔();
  }
}

function showCongrats() {
  const quiz = QUIZZES[state.category];
  const isLast = state.index === quiz.questions.length - 1;
  app.innerHTML = `
    <div class="fade-in card congrats">
      <div class="big-emoji">🎊</div>
      <div class="title">Congratulations!</div>
      <p class="message">That's the correct answer. You're on a roll!</p>
      <div class="actions">
        <button onclick="${isLast ? "showFinal()" : "nextQuestion()"}">${isLast ? "See my score" : "Next question"}</button>
      </div>
    </div>`;
}

function showTryAgain() {
  app.innerHTML = `
    <div class="fade-in card tryagain">
      <div class="big-emoji">🙈</div>
      <div class="title">Oops, try again!</div>
      <p class="message">That wasn't the right answer. Give it another shot!</p>
      <div class="actions">
        <button onclick="retry()">Try again</button>
        <button class="secondary" onclick="showMenu()">Back to menu</button>
      </div>
    </div>`;
}

function nextQuestion() {
  state.index++;
  showQuestion();
}

function retry() {
  state.wrongAnswer = null;
  showQuestion();
}

function showFinal() {
  const quiz = QUIZZES[state.category];
  app.innerHTML = `
    <div class="fade-in card">
      <div class="big-emoji">${quiz.emoji}</div>
      <div class="title">Quiz complete!</div>
      <p class="message">You got all ${quiz.questions.length} questions right.</p>
      <div class="score">${state.score} / ${quiz.questions.length}</div>
      <div class="actions">
        <button onclick="startQuiz('${state.category}')">Play again</button>
        <button class="secondary" onclick="showMenu()">Choose another quiz</button>
      </div>
    </div>`;
}

showMenu();
</script>
</body>
</html>
